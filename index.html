<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ipamus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <div id="home-page">
    <img src="assets/logo.jpeg" class="logo" />
    <h2 class="name-shop">22TEAM SHOP</h2>
    <img src="assets/cover.jpeg" class="cover" />

  </div>

  <div id="fav-page" style="display:none"></div>

  <div id="cart-page" style="display:none"></div>

  <div id="profile-page" style="display:none">
    <img src="assets/logo.jpeg" class="profile-icon" />
    <h2 class="nickname">Настройки</h2>
    <div style="display: none;" class="item"><a href="https://t.me/DoTheWeb">Информация о разработчике</a></div>

    <div class="item2"><a href="https://t.me/FORTUNA_22TEAM">Техническая поддержка</a></div>

    <div class="item2"><a href="https://t.me/Ivan_Pravosudov">Оформление заказа</a></div>
        <div class="item2"><a href="https://t.me/DoTheWeb">Информация</a></div>

  </div>

  <div id="product-page" style="display:none">
    <div class="slider" id="productSlider"></div>

    <button class="closebtn" onclick="closeProduct()">X</button>

    <h2 class="size-text">Размер одежды: </h2>
    <div id="sizeButtons"></div>

    <h2 class="product-name" id="productName"></h2>
    <div id="colorButtons"></div>

    <h2 class="product-price" id="productPrice"></h2>

    <h2 class="product-desc-title">Описание товара:</h2>
    <h3 class="product-desc-text" id="productDesc"></h3>

    <h2 class="product-questions">Остались вопросы?</h2>
    <h2 class="product-like" id="productLike">Добавить в избранное </h2>

    <button class="writetohelp"><a href="https://t.me/FORTUNA_22TEAM">Написать в поддержку</a></button>
    <button class="addtocart" id="addToCartBtn">Добавить в корзину</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <div class="icon"><i class="fa-solid fa-house"></i></div>
      <span>Главная</span>
    </button>

    <button class="nav-item" data-page="fav">
      <div class="badge" id="favBadge"></div>
      <div class="icon"><i class="fa-solid fa-heart"></i></div>
      <span>Избранное</span>
    </button>

    <button class="nav-item" data-page="cart">
      <div class="badge" id="cartBadge"></div>
      <div class="icon"><i class="fa-solid fa-cart-shopping"></i></div>
      <span>Корзина</span>
    </button>

    <button class="nav-item" data-page="profile">
      <div class="icon"><i class="fa-solid fa-user"></i></div>
      <span>Профиль</span>
    </button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
